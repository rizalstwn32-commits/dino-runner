<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Game Saya</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #202124;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
        }
        h1 { margin-bottom: 20px; font-size: 24px; text-align: center; }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            padding: 0 20px;
        }
        a.game-btn {
            display: block;
            padding: 15px;
            text-align: center;
            background: #8ab4f8;
            color: #202124;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>🎮 Koleksi Game Saya</h1>
    <div class="menu-container">
        <a href="./dino/" class="game-btn">Chrome Dino Runner</a>
    </div>

</body>
</html>
