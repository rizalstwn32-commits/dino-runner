<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dino Runner Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .pixel-btn {
            box-shadow: inset -4px -4px 0px 0px #374151;
            transition: all 0.1s ease;
        }
        .pixel-btn:active {
            box-shadow: inset 4px 4px 0px 0px #1f2937;
            transform: translateY(2px);
        }

        .game-container {
            transition: background-color 1s ease, color 1s ease;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Game Wrapper -->
    <div class="w-full max-w-4xl bg-gray-800 rounded-2xl p-6 shadow-2xl border-4 border-gray-700 flex flex-col items-center">
        
        <!-- Header / Titles -->
        <div class="w-full flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-green-400 tracking-wider">DINO RUNNER</h1>
                <p class="text-xs text-gray-400 mt-1">Lompat: Spasi / Panah Atas / Tap Layar</p>
            </div>
            
            <!-- Sound Toggle & HighScore Display -->
            <div class="flex items-center gap-4 text-xs">
                <button id="soundToggle" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-xs flex items-center gap-1 transition">
                    🔊 <span id="soundStatus">ON</span>
                </button>
                <div class="bg-gray-900 px-4 py-2 rounded-lg border border-gray-700 text-yellow-400">
                    HI: <span id="highScoreText">00000</span>
                </div>
            </div>
        </div>

        <!-- Canvas Game Container -->
        <div id="gameContainer" class="game-container relative w-full bg-white rounded-xl overflow-hidden shadow-inner border-2 border-gray-300 aspect-[16/6] min-h-[220px] md:min-h-[280px]">
            
            <!-- Dynamic Canvas -->
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

            <!-- Game Over Overlay -->
            <div id="gameOverModal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center gap-4 text-white z-10 animate-fade-in">
                <h2 class="text-2xl md:text-3xl text-red-500 font-bold tracking-widest animate-bounce">GAME OVER</h2>
                <p class="text-xs md:text-sm text-gray-300">Skor Akhir: <span id="finalScore" class="text-yellow-400">0</span></p>
                
                <button id="restartBtn" class="pixel-btn bg-green-500 hover:bg-green-600 text-gray-900 font-bold px-6 py-3 rounded-lg text-xs md:text-sm mt-2 flex items-center gap-2 cursor-pointer">
                    🔄 MAIN LAGI
                </button>
            </div>

            <!-- Start Prompt Overlay -->
            <div id="startModal" class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center text-white z-10">
                <div class="text-center p-4 bg-gray-900/90 rounded-xl border border-gray-700">
                    <p class="text-xs md:text-sm mb-3">TEKAN <span class="text-green-400">SPASI</span> ATAU <span class="text-green-400">TAP LAYAR</span> UNTUK MULAI</p>
                    <div class="text-[10px] text-gray-400">Hindari Kaktus & Burung Pterodactyl!</div>
                </div>
            </div>
        </div>

        <!-- Touch Controls for Mobile -->
        <div class="w-full mt-4 grid grid-cols-2 gap-3 md:hidden">
            <button id="mobileJumpBtn" class="bg-blue-600 active:bg-blue-700 text-white py-4 rounded-xl font-bold text-center text-sm shadow-lg active:scale-95 transition">
                🦘 LOMPAT
            </button>
            <button id="mobileDuckBtn" class="bg-yellow-600 active:bg-yellow-700 text-white py-4 rounded-xl font-bold text-center text-sm shadow-lg active:scale-95 transition">
                🦆 MERUNDUK
            </button>
        </div>

        <!-- Footer Instructions -->
        <div class="mt-4 text-center text-[10px] text-gray-500">
            Gunakan panah bawah (↓) untuk merunduk saat ada burung tinggi!
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // Setup Canvas & Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        // UI Elements
        const gameOverModal = document.getElementById('gameOverModal');
        const startModal = document.getElementById('startModal');
        const restartBtn = document.getElementById('restartBtn');
        const highScoreText = document.getElementById('highScoreText');
        const finalScoreText = document.getElementById('finalScore');
        const soundToggle = document.getElementById('soundToggle');
        const soundStatus = document.getElementById('soundStatus');
        const mobileJumpBtn = document.getElementById('mobileJumpBtn');
        const mobileDuckBtn = document.getElementById('mobileDuckBtn');

        // Web Audio API Synth Effects
        let soundEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundStatus.innerText = soundEnabled ? 'ON' : 'OFF';
        });

        let scale = 1;
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            scale = canvas.height / 300;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('dino_high_score') || 0;
        let gameSpeed = 6;
        let frameCount = 0;
        let isNight = false;

        highScoreText.innerText = String(highScore).padStart(5, '0');

        const GRAVITY = 0.6;
        const GROUND_Y_OFFSET = 30;

        const dino = {
            x: 50,
            y: 0,
            width: 44,
            height: 48,
            dy: 0,
            jumpForce: -11.5,
            isGrounded: false,
            isDucking: false,
            legFrame: 0,
            
            reset() {
                this.x = 50;
                this.height = 48;
                this.y = canvas.height - this.height - (GROUND_Y_OFFSET * scale);
                this.dy = 0;
                this.isGrounded = true;
                this.isDucking = false;
            },

            update() {
                const scaledGravity = GRAVITY * scale;
                const groundY = canvas.height - (this.isDucking ? 28 * scale : 48 * scale) - (GROUND_Y_OFFSET * scale);

                if (this.isDucking && this.isGrounded) {
                    this.height = 28 * scale;
                    this.width = 55 * scale;
                } else {
                    this.height = 48 * scale;
                    this.width = 44 * scale;
                }

                this.dy += scaledGravity;
                this.y += this.dy;

                if (this.y >= groundY) {
                    this.y = groundY;
                    this.dy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                if (frameCount % 6 === 0) {
                    this.legFrame = (this.legFrame + 1) % 2;
                }
            },

            jump() {
                if (this.isGrounded && !this.isDucking) {
                    this.dy = this.jumpForce * Math.sqrt(scale);
                    this.isGrounded = false;
                    playSound('jump');
                }
            },

            draw() {
                ctx.fillStyle = isNight ? '#E5E7EB' : '#374151';

                const px = this.x;
                const py = this.y;
                const w = this.width;
                const h = this.height;

                if (!this.isDucking) {
                    ctx.fillRect(px + w * 0.3, py + h * 0.3, w * 0.5, h * 0.4);
                    ctx.fillRect(px + w * 0.4, py, w * 0.5, h * 0.35);
                    ctx.fillRect(px + w * 0.7, py + h * 0.1, w * 0.3, h * 0.2);
                    ctx.fillStyle = isNight ? '#111827' : '#FFFFFF';
                    ctx.fillRect(px + w * 0.55, py + h * 0.05, w * 0.1, h * 0.1);
                    ctx.fillStyle = isNight ? '#E5E7EB' : '#374151';
                    ctx.fillRect(px, py + h * 0.35, w * 0.3, h * 0.2);
                    ctx.fillRect(px + w * 0.1, py + h * 0.5, w * 0.2, h * 0.1);
                    ctx.fillRect(px + w * 0.65, py + h * 0.4, w * 0.15, h * 0.08);

                    if (!this.isGrounded) {
                        ctx.fillRect(px + w * 0.35, py + h * 0.7, w * 0.12, h * 0.2);
                        ctx.fillRect(px + w * 0.55, py + h * 0.7, w * 0.12, h * 0.2);
                    } else if (this.legFrame === 0) {
                        ctx.fillRect(px + w * 0.35, py + h * 0.7, w * 0.12, h * 0.3);
                        ctx.fillRect(px + w * 0.55, py + h * 0.7, w * 0.12, h * 0.15);
                    } else {
                        ctx.fillRect(px + w * 0.35, py + h * 0.7, w * 0.12, h * 0.15);
                        ctx.fillRect(px + w * 0.55, py + h * 0.7, w * 0.12, h * 0.3);
                    }
                } else {
                    ctx.fillRect(px, py + h * 0.2, w * 0.7, h * 0.5);
                    ctx.fillRect(px + w * 0.6, py, w * 0.35, h * 0.4);
                    ctx.fillStyle = isNight ? '#111827' : '#FFFFFF';
                    ctx.fillRect(px + w * 0.75, py + h * 0.08, w * 0.08, h * 0.15);
                    ctx.fillStyle = isNight ? '#E5E7EB' : '#374151';
                    ctx.fillRect(px - w * 0.1, py + h * 0.2, w * 0.15, h * 0.2);
                    if (this.legFrame === 0) {
                        ctx.fillRect(px + w * 0.2, py + h * 0.7, w * 0.12, h * 0.3);
                        ctx.fillRect(px + w * 0.5, py + h * 0.7, w * 0.12, h * 0.15);
                    } else {
                        ctx.fillRect(px + w * 0.2, py + h * 0.7, w * 0.12, h * 0.15);
                        ctx.fillRect(px + w * 0.5, py + h * 0.7, w * 0.12, h * 0.3);
                    }
                }
            }
        };

        let obstacles = [];
        class Cactus {
            constructor(x) {
                this.x = x;
                this.type = 'cactus';
                this.variant = Math.floor(Math.random() * 3);
                
                if (this.variant === 0) {
                    this.width = 20 * scale;
                    this.height = 38 * scale;
                } else if (this.variant === 1) {
                    this.width = 26 * scale;
                    this.height = 50 * scale;
                } else {
                    this.width = 45 * scale;
                    this.height = 40 * scale;
                }

                this.y = canvas.height - this.height - (GROUND_Y_OFFSET * scale);
            }

            update() {
                this.x -= gameSpeed * scale;
            }

            draw() {
                ctx.fillStyle = isNight ? '#10B981' : '#059669';
                const px = this.x;
                const py = this.y;
                const w = this.width;
                const h = this.height;

                if (this.variant === 0 || this.variant === 1) {
                    ctx.fillRect(px + w * 0.3, py, w * 0.4, h);
                    ctx.fillRect(px, py + h * 0.3, w * 0.3, h * 0.12);
                    ctx.fillRect(px, py + h * 0.15, w * 0.12, h * 0.25);
                    ctx.fillRect(px + w * 0.7, py + h * 0.4, w * 0.3, h * 0.12);
                    ctx.fillRect(px + w * 0.88, py + h * 0.25, w * 0.12, h * 0.25);
                } else {
                    ctx.fillRect(px, py + h * 0.2, w * 0.28, h * 0.8);
                    ctx.fillRect(px + w * 0.35, py, w * 0.3, h);
                    ctx.fillRect(px + w * 0.7, py + h * 0.3, w * 0.28, h * 0.7);
                }
            }
        }

        class Pterodactyl {
            constructor(x) {
                this.x = x;
                this.type = 'bird';
                this.width = 42 * scale;
                this.height = 30 * scale;
                const heights = [
                    canvas.height - (GROUND_Y_OFFSET * scale) - 25 * scale,
                    canvas.height - (GROUND_Y_OFFSET * scale) - 52 * scale,
                    canvas.height - (GROUND_Y_OFFSET * scale) - 75 * scale
                ];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }

            update() {
                this.x -= (gameSpeed + 1.5) * scale;
                if (frameCount % 12 === 0) {
                    this.wingFrame = (this.wingFrame + 1) % 2;
                }
            }

            draw() {
                ctx.fillStyle = isNight ? '#F3F4F6' : '#1F2937';
                const px = this.x;
                const py = this.y;
                const w = this.width;
                const h = this.height;

                ctx.fillRect(px + w * 0.2, py + h * 0.4, w * 0.5, h * 0.25);
                ctx.fillRect(px + w * 0.7, py + h * 0.45, w * 0.3, h * 0.15);
                ctx.fillRect(px, py + h * 0.3, w * 0.2, h * 0.15);

                if (this.wingFrame === 0) {
                    ctx.fillRect(px + w * 0.3, py, w * 0.25, h * 0.4);
                } else {
                    ctx.fillRect(px + w * 0.3, py + h * 0.65, w * 0.25, h * 0.4);
                }
            }
        }

        let groundX = 0;
        const clouds = [];
        const stars = [];

        function initEnvironment() {
            clouds.length = 0;
            stars.length = 0;
            for (let i = 0; i < 4; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height / 2),
                    width: (40 + Math.random() * 30) * scale,
                    speed: (0.5 + Math.random() * 0.5) * scale
                });
            }
            for (let i = 0; i < 20; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height / 2),
                    size: (1 + Math.random() * 2) * scale
                });
            }
        }

        function updateEnvironment() {
            groundX = (groundX - gameSpeed * scale) % (20 * scale);
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.width < 0) {
                    cloud.x = canvas.width + Math.random() * 50;
                    cloud.y = Math.random() * (canvas.height / 2);
                }
            });
        }

        function drawEnvironment() {
            if (isNight) {
                ctx.fillStyle = '#111827';
            } else {
                ctx.fillStyle = '#FFFFFF';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isNight) {
                ctx.fillStyle = '#F9FAFB';
                stars.forEach(star => {
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });
            }

            ctx.fillStyle = isNight ? '#374151' : '#E5E7EB';
            clouds.forEach(cloud => {
                ctx.fillRect(cloud.x, cloud.y, cloud.width, 12 * scale);
                ctx.fillRect(cloud.x + 8 * scale, cloud.y - 6 * scale, cloud.width - 16 * scale, 6 * scale);
            });

            ctx.fillStyle = isNight ? '#4B5563' : '#9CA3AF';
            const groundY = canvas.height - (GROUND_Y_OFFSET * scale);
            ctx.fillRect(0, groundY, canvas.width, 2 * scale);

            for (let x = groundX; x < canvas.width; x += 25 * scale) {
                ctx.fillRect(x, groundY + 8 * scale, 4 * scale, 2 * scale);
                ctx.fillRect(x + 10 * scale, groundY + 16 * scale, 2 * scale, 2 * scale);
            }
        }

        function handleObstacles() {
            if (obstacles.length === 0 || (canvas.width - obstacles[obstacles.length - 1].x) > (220 * scale + Math.random() * 180 * scale)) {
                if (score > 300 && Math.random() < 0.3) {
                    obstacles.push(new Pterodactyl(canvas.width));
                } else {
                    obstacles.push(new Cactus(canvas.width));
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                const padding = 6 * scale;
                if (
                    dino.x + padding < obs.x + obs.width - padding &&
                    dino.x + dino.width - padding > obs.x + padding &&
                    dino.y + padding < obs.y + obs.height - padding &&
                    dino.y + dino.height - padding > obs.y + padding
                ) {
                    triggerGameOver();
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawScore() {
            ctx.fillStyle = isNight ? '#F9FAFB' : '#111827';
            ctx.font = `${Math.max(12, 14 * scale)}px "Press Start 2P"`;
            ctx.textAlign = 'right';
            const scoreStr = String(Math.floor(score)).padStart(5, '0');
            ctx.fillText(`SCORE: ${scoreStr}`, canvas.width - 20, 30 * scale);
        }

        let animationFrameId;
        function gameLoop() {
            if (!isPlaying) return;

            frameCount++;
            score += 0.15;

            gameSpeed = 6 + Math.floor(score / 200) * 0.8;

            if (Math.floor(score) > 0 && Math.floor(score) % 100 === 0 && frameCount % 6 === 0) {
                playSound('score');
            }

            isNight = Math.floor(score / 700) % 2 === 1;

            drawEnvironment();
            updateEnvironment();

            dino.update();
            dino.draw();

            handleObstacles();
            drawScore();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();
            isPlaying = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            obstacles = [];
            
            dino.reset();
            initEnvironment();

            startModal.classList.add('hidden');
            gameOverModal.classList.add('hidden');

            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function triggerGameOver() {
            isPlaying = false;
            isGameOver = true;
            playSound('die');

            if (Math.floor(score) > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('dino_high_score', highScore);
                highScoreText.innerText = String(highScore).padStart(5, '0');
            }

            finalScoreText.innerText = String(Math.floor(score)).padStart(5, '0');
            gameOverModal.classList.remove('hidden');
        }

        function handleKeyDown(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!isPlaying && !isGameOver) {
                    startGame();
                } else if (isGameOver) {
                    startGame();
                } else {
                    dino.jump();
                }
            }
            if (e.code === 'ArrowDown' && isPlaying) {
                e.preventDefault();
                dino.isDucking = true;
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'ArrowDown') {
                dino.isDucking = false;
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isPlaying) {
                startGame();
            } else {
                dino.jump();
            }
        }, { passive: false });

        startModal.addEventListener('click', () => {
            if (!isPlaying) startGame();
        });

        restartBtn.addEventListener('click', () => {
            startGame();
        });

        mobileJumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isPlaying && !isGameOver) startGame();
            else dino.jump();
        });

        mobileDuckBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isPlaying) dino.isDucking = true;
        });

        mobileDuckBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            dino.isDucking = false;
        });

        resizeCanvas();
        initEnvironment();
        drawEnvironment();
        dino.reset();
        dino.draw();
    </script>
</body>
</html>
